<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Climax</title>
    <!-- Geist + Geist Mono, self-hosted (no Google Fonts network call): instant,
         offline, and no third-party ping from a private app. -->
    <link rel="stylesheet" href="/fonts.css" />
    <style>
      /* Paint the app's dark base colour (--ink-950) from the very first frame
         and keep the content hidden until the SPA has mounted and its styles are
         applied. A cold WebView2 start otherwise flashes a white page of
         unstyled content for a beat. Each route reveals the body in onMount; the
         timeout is a safety net if that somehow never fires. */
      html { background-color: #0A0B0F; }
      body { visibility: hidden; }
    </style>
    <script>
      setTimeout(function () {
        if (document.body) document.body.style.visibility = "visible";
      }, 2500);
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
